name: Brand V2 backup operator discovery (read only)

on:
  pull_request:
    branches: ['feat/brand-v2']
    paths: ['.github/workflows/brand-v2-operator-discovery.yml']

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.head_ref == 'ops/brand-v2-backup-discovery' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DRVOWA_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect backup readiness (no data or credentials)
        env:
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
          VPS_USER: ${{ secrets.DRVOWA_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/drvowa/app
          test -r .env.production.local
          echo '==> Read-only SQL backup operator diagnostics'
          if [ "$(id -u)" -eq 0 ]; then echo 'SSH identity has root: yes'; else echo 'SSH identity has root: no'; fi
          if command -v sqlcmd >/dev/null 2>&1 || test -x /opt/mssql-tools18/bin/sqlcmd; then
            echo 'SQL Server client CLI on VPS: yes'
          else
            echo 'SQL Server client CLI on VPS: no'
          fi
          if systemctl list-unit-files mssql-server.service --no-legend 2>/dev/null | grep -q '^mssql-server.service'; then
            echo 'Local mssql-server unit configured: yes'
          else
            echo 'Local mssql-server unit configured: no'
          fi
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo 'Docker on VPS accessible: yes'
          else
            echo 'Docker on VPS accessible: no'
          fi
          node --env-file=.env.production.local --input-type=module <<'JS'
          import { lookup } from 'node:dns/promises';
          import { networkInterfaces } from 'node:os';
          const server = process.env.DB_SERVER;
          if (!server) { console.log('SQL endpoint placement: unknown'); process.exit(0); }
          const host = server.replace(/^\[|\]$/g, '').split('\\')[0].trim();
          const own = new Set(['127.0.0.1','::1','localhost']);
          for (const addresses of Object.values(networkInterfaces())) {
            for (const entry of addresses || []) own.add(entry.address);
          }
          try {
            const resolved = await lookup(host, { all: true });
            const local = resolved.some(({address}) => own.has(address)) || own.has(host);
            console.log('SQL endpoint resolves to VPS network interface:', local ? 'yes' : 'no');
          } catch { console.log('SQL endpoint placement: cannot resolve'); }
          JS
          echo 'No SQL writes, SSH remote mutations, backup data or credentials produced.'
          REMOTE
