name: Group finance contract checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/modules/billing/admin-financial-report.ts"
      - "src/modules/billing/group-finance-*"
      - "src/components/admin/admin-financial-dashboard.tsx"
      - "src/app/admin/**"
      - "src/app/api/internal/group-finance/**"
      - ".github/workflows/group-finance-ci.yml"
      - "tests/group-finance-*.test.ts"
      - "tests/admin-dashboard-read-model.test.ts"
      - "src/modules/billing/admin-*.ts"
      - "src/components/admin/admin-*.tsx"
      - "src/app/api/admin/financials/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and finance contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Finance contract unit tests
        run: npx vitest run tests/group-finance-contract.test.ts tests/group-finance-export.test.ts tests/admin-dashboard-read-model.test.ts
      - name: Lint changed finance modules
        run: npx eslint src/modules/billing/admin-*.ts src/modules/billing/group-finance-*.ts src/components/admin/admin-*.tsx src/app/admin/page.tsx src/app/admin/financials/page.tsx src/app/admin/subscriptions/page.tsx src/app/api/admin/financials src/app/api/internal/group-finance/v1
      - name: Production build
        run: npm run build
