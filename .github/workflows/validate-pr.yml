name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migration file order
        run: npm run test:migration-gate -- --files-only
      - name: Production build
        run: npm run build
      - name: Resume catch-up unit tests
        run: npx vitest run tests/unit/resume-catch-up.test.ts tests/unit/resume-catch-up-service.test.ts
      - name: Inbox viewport regression tests
        run: npx vitest run tests/unit/inbox-layout-contract.test.tsx
      - name: Full test suite
        run: npm test
