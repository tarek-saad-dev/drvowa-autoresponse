name: Validate pull request

on:
  pull_request:
    branches: [main, 'feat/brand-v2']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migration file order
        run: npm run test:migration-gate -- --files-only
      - name: Production build
        run: npm run build
      - name: Resume catch-up unit tests
        run: npx vitest run tests/unit/resume-catch-up.test.ts tests/unit/resume-catch-up-service.test.ts
      - name: Inbox viewport regression tests
        run: npx vitest run tests/unit/inbox-layout-contract.test.tsx
      - name: Full test suite
        run: npm test
      - name: Brand V2 final legacy-name / palette review (informational)
        if: ${{ github.head_ref == 'feat/brand-v2-p09-release-gates' }}
        run: node scripts/brand-v2-audit.mjs --review
      - name: Brand V2 source inventory (informational)
        if: ${{ github.base_ref == 'feat/brand-v2' }}
        run: |
          node scripts/brand-v2-audit.mjs --json > /tmp/brand-v2-inventory.json
          node -e 'const t=JSON.parse(require("node:fs").readFileSync("/tmp/brand-v2-inventory.json","utf8")).totals; console.log("Brand V2 audit counts:",JSON.stringify(t))'


  brand-v2-public-browser:
    name: Anonymous browser screenshots (Brand V2 release only)
    if: ${{ github.head_ref == 'feat/brand-v2-p09-release-gates' || (github.base_ref == 'main' && github.head_ref == 'feat/brand-v2') }}
    # Playwright 1.55 does not support Ubuntu 26.04 used by ubuntu-latest here.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Capture and validate public light/dark RTL pages
        env:
          E2E_START_SERVER: '1'
          E2E_BASE_URL: 'http://localhost:3000'
        run: npx playwright test e2e/brand-v2-public-review.spec.ts --project=chromium
      - name: Upload visual QA screenshots and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brand-v2-public-browser-evidence
          path: |
            test-results/brand-v2/*.png
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 14
