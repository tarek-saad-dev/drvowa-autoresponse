name: Deploy isolated Agent campaigns UI hotfix

on:
  push:
    branches:
      - hotfix/agent-campaign-tab-only-20261114

permissions:
  contents: read

concurrency:
  group: drvowa-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify pinned production baseline and exact UI diff
        shell: bash
        run: |
          set -euo pipefail
          BASE="df4d2af5a648f3ad38667bf5a293f8d17dc605fb"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE..HEAD")" = 1
          CHANGED_FILES="$(git diff --name-only "$BASE" HEAD)"
          test -n "$CHANGED_FILES"
          while IFS= read -r file; do
            case "$file" in
              '.github/workflows/deploy-agent-campaign-hotfix.yml'|'src/app/(app)/dashboard/agent/page.tsx'|'src/components/dashboard/employee-studio.tsx'|'tests/unit/agent-campaigns-coming-soon.test.ts')
                ;;
              *) echo "BLOCKED: non-visual hotfix file: $file"; exit 1 ;;
            esac
          done <<< "$CHANGED_FILES"
          grep -Fq 'aria-disabled="true"' src/components/dashboard/employee-studio.tsx
          grep -Fq 'قريبًا' src/components/dashboard/employee-studio.tsx
          ! grep -Fq 'setTab("campaigns")' src/components/dashboard/employee-studio.tsx
          ! grep -Fq 'LabelCampaignChat' src/components/dashboard/employee-studio.tsx
          echo "PASS: exact single-commit visual-only patch anchored to deployed baseline"
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify campaigns tab disabled regression
        run: npx vitest run tests/unit/agent-campaigns-coming-soon.test.ts
      - name: Verify production build
        run: npm run build
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DRVOWA_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy UI-only patch to the pinned running baseline
        env:
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
          VPS_USER: ${{ secrets.DRVOWA_VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BASE: df4d2af5a648f3ad38667bf5a293f8d17dc605fb
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "DEPLOY_SHA=$DEPLOY_SHA DEPLOY_BASE=$DEPLOY_BASE bash -se" <<'REMOTE'
            set -euo pipefail
            cd /home/drvowa/app
            CURRENT_SHA="$(git rev-parse HEAD)"
            test "$CURRENT_SHA" = "$DEPLOY_BASE" || { echo "BLOCKED: VPS no longer on pinned baseline; no changes made"; exit 1; }
            git fetch origin hotfix/agent-campaign-tab-only-20261114
            test "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_SHA" || { echo "BLOCKED: branch changed; no changes made"; exit 1; }
            test "$(git show -s --format=%P "$DEPLOY_SHA")" = "$DEPLOY_BASE" || { echo "BLOCKED: unexpected parent"; exit 1; }
            CHANGED_FILES="$(git diff --name-only "$DEPLOY_BASE" "$DEPLOY_SHA")"
            test -n "$CHANGED_FILES"
            while IFS= read -r file; do
              case "$file" in
                '.github/workflows/deploy-agent-campaign-hotfix.yml'|'src/app/(app)/dashboard/agent/page.tsx'|'src/components/dashboard/employee-studio.tsx'|'tests/unit/agent-campaigns-coming-soon.test.ts')
                  ;;
                *) echo "BLOCKED: non-visual file on VPS: $file"; exit 1 ;;
              esac
            done <<< "$CHANGED_FILES"
            test -r .env.production.local || { echo "BLOCKED: production app env missing"; exit 1; }
            systemctl is-active --quiet drvowa-ai-worker.service || { echo "BLOCKED: AI worker unhealthy"; exit 1; }
            CHECKED_OUT=0
            recover_app() {
              result="$?"
              trap - EXIT
              if [ "$result" -ne 0 ] && [ "$CHECKED_OUT" -eq 1 ]; then
                echo "==> UI-only patch failed; restoring pinned previous app version"
                set +e
                git checkout --detach "$DEPLOY_BASE"
                npm ci && npm run build && systemctl restart drvowa.service
                if ! systemctl is-active --quiet drvowa.service; then
                  echo "ERROR: rollback service not healthy; investigate manually"
                fi
              fi
              exit "$result"
            }
            trap recover_app EXIT
            echo "==> Applying isolated UI patch without any SQL migration or env modification"
            git checkout --detach "$DEPLOY_SHA"
            CHECKED_OUT=1
            npm ci
            npm run build
            systemctl restart drvowa.service
            HEALTHY=0
            for attempt in {1..15}; do
              if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3100/api/health >/dev/null; then
                HEALTHY=1
                break
              fi
              sleep 2
            done
            test "$HEALTHY" = 1 || { echo "BLOCKED: app health check failed"; exit 1; }
            systemctl is-active --quiet drvowa-ai-worker.service || { echo "BLOCKED: AI worker unhealthy"; exit 1; }
            echo "PASS: isolated Agent campaigns disabled tab deployed; SQL untouched; worker untouched; app healthy"
          REMOTE
