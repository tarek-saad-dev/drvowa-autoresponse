name: Brand V2 production preflight (read only)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/brand-v2-production-preflight.yml'
      - 'db/migrations/**'
      - 'src/components/brand/**'
      - 'src/modules/brand/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-preflight:
    # Never run against arbitrary PRs or forks; only the known internal release branch.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/brand-v2' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Confirm SSH secret availability without disclosure
        env:
          HOST: ${{ secrets.DRVOWA_VPS_HOST }}
          USER: ${{ secrets.DRVOWA_VPS_USER }}
          KEY: ${{ secrets.DRVOWA_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" || {
            echo "::error::Production SSH secrets are unavailable; release blocked"
            exit 1
          }
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DRVOWA_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only production health, rollback SHA and SQL full-backup evidence
        env:
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
          VPS_USER: ${{ secrets.DRVOWA_VPS_USER }}
          EXPECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "EXPECTED_MAIN_SHA=$EXPECTED_MAIN_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          cd /home/drvowa/app

          printf '==> Running read-only production release gate\n'
          sha="$(git rev-parse HEAD)"
          printf 'Deployed app SHA: %s\nExpected main SHA: %s\n' "$sha" "$EXPECTED_MAIN_SHA"
          test "$sha" = "$EXPECTED_MAIN_SHA" || {
            echo "BLOCKED: VPS is not on current main. Review unexpected divergence before deploy."
            exit 1
          }
          test -r .env.production.local || {
            echo "BLOCKED: production env is unavailable"
            exit 1
          }

          for unit in drvowa.service drvowa-ai-worker.service nginx.service; do
            if systemctl is-active --quiet "$unit"; then
              printf 'Active service: %s\n' "$unit"
            else
              printf 'BLOCKED: %s inactive\n' "$unit"
              exit 1
            fi
          done

          curl --fail --silent --show-error --max-time 15             'http://127.0.0.1:3100/api/health?ready=1' |
            node -e '
              let raw="";
              process.stdin.on("data",(chunk)=>raw+=chunk);
              process.stdin.on("end",()=>{
                const health=JSON.parse(raw);
                if(health.status!=="ok"||health.database!=="up"){
                  console.error("BLOCKED: app or SQL readiness not healthy");
                  process.exitCode=1;
                }else{
                  console.log("App and SQL readiness: OK");
                }
              });
            '

          echo '==> Read-only SQL backup operator readiness'
          if [ "$(id -u)" -eq 0 ]; then echo 'SSH operator can administer VPS: yes'; else echo 'SSH operator can administer VPS: no'; fi
          if command -v sqlcmd >/dev/null 2>&1 || test -x /opt/mssql-tools18/bin/sqlcmd; then
            echo 'SQL Server client on VPS: yes'
          else
            echo 'SQL Server client on VPS: no'
          fi
          if systemctl list-unit-files mssql-server.service --no-legend 2>/dev/null | grep -q '^mssql-server.service'; then
            echo 'Local SQL Server systemd service configured: yes'
          else
            echo 'Local SQL Server systemd service configured: no'
          fi
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo 'Docker daemon accessible: yes'
          else
            echo 'Docker daemon accessible: no'
          fi
          node --env-file=.env.production.local --input-type=module <<'DISCOVERY'
          import { lookup } from 'node:dns/promises';
          import { networkInterfaces } from 'node:os';
          const server = process.env.DB_SERVER;
          if (!server) { console.log('SQL endpoint is on VPS: unknown'); process.exit(0); }
          const host = server.replace(/^\\[|\\]$/g, '').split('\\\\')[0].trim();
          const own = new Set(['127.0.0.1','::1','localhost']);
          for (const items of Object.values(networkInterfaces())) for (const item of items ?? []) own.add(item.address);
          try {
            const addresses = await lookup(host, { all: true });
            console.log('SQL endpoint is on VPS:', own.has(host) || addresses.some(x => own.has(x.address)) ? 'yes' : 'no');
          } catch { console.log('SQL endpoint is on VPS: unknown'); }
          DISCOVERY
          echo '==> Checking SQL Server full backup metadata (no names, paths or secrets printed)'
          node --env-file=.env.production.local --input-type=module <<'JS'
          import sql from "mssql";
          const required = ["DB_SERVER", "DB_PORT", "DB_NAME", "DB_USER", "DB_PASSWORD"];
          for (const key of required) {
            if (!process.env[key]) throw new Error("BLOCKED: DB config incomplete (" + key + ")");
          }
          const parseBool = (value, fallback) =>
            value == null ? fallback : ["true","1","yes"].includes(value.toLowerCase());
          const pool = await new sql.ConnectionPool({
            server: process.env.DB_SERVER,
            port: Number(process.env.DB_PORT),
            database: process.env.DB_NAME,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            options: {
              encrypt: parseBool(process.env.DB_ENCRYPT, true),
              trustServerCertificate: parseBool(process.env.DB_TRUST_SERVER_CERTIFICATE, false),
            },
            connectionTimeout: 15000,
            requestTimeout: 20000,
          }).connect();
          try {
            const result = await pool.request().query(`
              SELECT TOP (1)
                backup_finish_date AS finished,
                backup_size AS bytes,
                is_damaged AS damaged,
                has_backup_checksums AS checksummed
              FROM msdb.dbo.backupset
              WHERE database_name = DB_NAME()
                AND type = N'D'
              ORDER BY backup_finish_date DESC
            `);
            // Read-only capacity and privilege diagnostics, printed without host paths or credentials.
            const diag = await pool.request().query(`
              SELECT
                CAST(SERVERPROPERTY('InstanceDefaultBackupPath') AS nvarchar(4000)) AS backupRoot,
                HAS_PERMS_BY_NAME(DB_NAME(), 'DATABASE', 'BACKUP DATABASE') AS canBackup,
                (SELECT SUM(CAST(size AS bigint)) * 8192 FROM sys.database_files WHERE type = 0) AS dataBytes
            `);
            const d = diag.recordset[0] || {};
            console.log("SQL backup default path configured:", Boolean(d.backupRoot));
            console.log("SQL user can back up this database:", Number(d.canBackup) === 1);
            console.log("SQL data allocation (GiB):", (Number(d.dataBytes || 0) / 1073741824).toFixed(2));
            try {
              const volumes = await pool.request().query(`
                SELECT TOP (1) v.volume_mount_point AS mount,
                  v.available_bytes AS availableBytes
                FROM sys.database_files f
                CROSS APPLY sys.dm_os_volume_stats(DB_ID(), f.file_id) v
                WHERE f.type=0 ORDER BY f.file_id
              `);
              const disk = volumes.recordset[0];
              const backupRoot = String(d.backupRoot || "");
              const mount = String(disk?.mount || "");
              const sameVolume = Boolean(backupRoot && mount &&
                backupRoot.toLowerCase().startsWith(mount.toLowerCase()));
              console.log("Default backup path appears on DB data-file volume:", sameVolume);
              console.log("DB data-file volume free (GiB):",
                disk ? (Number(disk.availableBytes) / 1073741824).toFixed(2) : "unknown");
            } catch {
              console.log("SQL volume free-space probe unavailable: permission or provider restriction");
            }
            const backup = result.recordset[0];
            if (!backup) throw new Error("BLOCKED: no full production SQL backup visible in msdb");
            const ageHours = (Date.now() - new Date(backup.finished).getTime()) / 3600000;
            const ok = ageHours >= 0 && ageHours <= 24 &&
              Number(backup.bytes) > 0 && !backup.damaged;
            console.log("Latest SQL full backup age (hours):", ageHours.toFixed(1));
            console.log("Backup metadata:", ok ? "recent and non-damaged" : "missing, stale or damaged");
            console.log("Backup checksum recorded:", Boolean(backup.checksummed));
            if (!ok) throw new Error("BLOCKED: recent (<=24h) full SQL backup is not verified by metadata");
            console.log("SQL backup metadata gate: PASS (restore/VERIFYONLY still needs independent validation)");
          } catch (error) {
            // Do not log SQL connection strings, backup paths or sensitive SQL errors.
            console.error("BLOCKED: cannot establish recent SQL full-backup evidence");
            process.exitCode = 1;
          } finally {
            await pool.close();
          }
          JS
          echo 'Production preflight complete: no application or database writes performed'
          REMOTE
