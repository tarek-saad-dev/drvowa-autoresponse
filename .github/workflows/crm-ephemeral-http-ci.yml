name: CRM ephemeral HTTP integration (synthetic only)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/modules/crm/**"
      - "src/modules/integrations/**"
      - "src/app/api/crm/**"
      - "src/app/api/auth/**"
      - "db/migrations/**"
      - "e2e/crm-ephemeral-http.spec.ts"
      - ".github/workflows/crm-ephemeral-http-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-ephemeral-http-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-erp-http:
    name: Next HTTP + isolated SQL + synthetic ERP emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CI-ephemeral-crm-7aF!42
        ports:
          - 1433:1433
    env:
      CI: "true"
      DRVO_TEST_ISOLATED_DB: "1"
      DB_SERVER: "localhost"
      DB_PORT: "1433"
      DB_NAME: "crm_ephemeral_ci"
      DB_USER: "sa"
      DB_PASSWORD: "CI-ephemeral-crm-7aF!42"
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      INTEGRATION_SECRET_KEY: "CI-ephemeral-integration-secret-not-production"
      MANUAL_INSTAPAY_ENABLED: "1"
      DRVO_SAAS_FINANCIAL_CAPTURE_ENABLED: "0"
      BILLING_EMAIL_NOTICES_ENABLED: "0"
      E2E_PORT: "3000"
      E2E_START_SERVER: "1"
      E2E_USE_DEV: "1"
      # No production or Cashier VPS credentials are exposed to this job.

    steps:
      - name: Checkout exact source PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove isolated CI SQL target before migrations
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DRVO_TEST_ISOLATED_DB" == "1" && "$DB_NAME" == "crm_ephemeral_ci" && "$DB_SERVER" == "localhost" ]]
          [[ "$DB_USER" == "sa" ]]
          [[ -z "${{ secrets.VPS_SSH_KEY }}" || "$DB_NAME" != "last132" ]]
          for f in .env .env.local .env.production .env.production.local; do
            [[ ! -f "$f" ]] || { echo "Refusing checked-in environment file: $f" >&2; exit 10; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Initialize throwaway SQL Server database
        run: |
          node --input-type=module <<'JS'
          import sql from 'mssql';
          let ok = false;
          for (let attempt = 0; attempt < 45; attempt++) {
            const pool = new sql.ConnectionPool({
              server: 'localhost', port: 1433, database: 'master',
              user: 'sa', password: process.env.DB_PASSWORD,
              options: { encrypt: true, trustServerCertificate: true },
              connectionTimeout: 2000,
            });
            try {
              await pool.connect();
              await pool.request().query("IF DB_ID(N'crm_ephemeral_ci') IS NULL CREATE DATABASE crm_ephemeral_ci");
              ok = true; break;
            } catch { await new Promise((resolve) => setTimeout(resolve, 2000)); }
            finally { await pool.close(); }
          }
          if (!ok) throw new Error('Ephemeral SQL service unavailable');
          JS
      - name: Apply AutoRespond migrations (including CRM 104)
        run: npm run db:migrate
      - name: Run isolated real Next HTTP + synthetic ERP integration
        run: npx playwright test e2e/crm-ephemeral-http.spec.ts --project=chromium --retries=0
      - name: Record scope in Actions summary
        if: always()
        run: |
          {
            echo "## CRM ephemeral HTTP integration"
            echo
            echo "- Database: crm_ephemeral_ci (throwaway GitHub Actions SQL container)"
            echo "- App: actual Next dev HTTP routes, PR checkout"
            echo "- ERP: synthetic Cashier contract HTTP emulator, NOT the live Cashier app"
            echo "- Coverage: encrypted pairing, ERP sync, Customer 360, channel-specific eligibility, freeze/revalidate, one-number persisted WhatsApp draft without send"
            echo "- Not covered: real Cashier HTTP runtime, Gemini inference, browser UI confirmation, WhatsApp delivery"
            echo "- No production connections, no bulk sends, no merge/deploy"
          } >> "$GITHUB_STEP_SUMMARY"
