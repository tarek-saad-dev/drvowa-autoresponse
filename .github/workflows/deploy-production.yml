name: Deploy DRVOWA Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: drvowa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  billing-checks:
    uses: ./.github/workflows/billing-sql-ci.yml
  whatsapp-source-checks:
    name: WhatsApp origin isolation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/unit/whatsapp-source-guard.test.ts
      - run: npm run typecheck
  deploy:
    needs: [billing-checks, whatsapp-source-checks]
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DRVOWA_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
          VPS_USER: ${{ secrets.DRVOWA_VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "DEPLOY_SHA=$DEPLOY_SHA bash -se" <<'REMOTE'
            set -euo pipefail

            cd /home/drvowa/app

            echo "==> Checking out the exact commit verified by billing SQL CI"
            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            echo "Deploying verified commit $DEPLOY_SHA"

            echo "==> Ensuring integration encryption secret"
            ENV_FILE=".env.production.local"
            touch "$ENV_FILE"
            if ! grep -q '^INTEGRATION_SECRET_KEY=' "$ENV_FILE"; then
              SECRET_VALUE="$(openssl rand -hex 32)"
              printf '\nINTEGRATION_SECRET_KEY=%s\n' "$SECRET_VALUE" >> "$ENV_FILE"
            fi
            chmod 600 "$ENV_FILE"

            echo "==> Installing locked dependencies"
            npm ci

            echo "==> Typecheck"
            npm run typecheck

            echo "==> Production build"
            npm run build

            echo "==> AI worker boot check"
            npm run ai:worker:check

            echo "==> Applying database migrations"
            npm run db:migrate

            echo "==> Validating admin financial reports against the production database (read-only)"
            npx tsx scripts/admin-financial-smoke.ts

            echo "==> Verifying billing refunds, net collections and replay (read-only)"
            test -r /etc/drvowa/financial-hub.env || { echo "Financial service environment is unavailable to billing smoke"; exit 1; }
            node --env-file-if-exists=.env.production.local --env-file=/etc/drvowa/financial-hub.env --import tsx scripts/billing-production-smoke.ts

            echo "==> Restarting app service"
            systemctl restart drvowa.service

            echo "==> Restarting AI worker for integration-aware replies"
            systemctl restart drvowa-ai-worker.service
            sleep 2
            WORKER_RESTARTS_BEFORE="$(systemctl show drvowa-ai-worker.service -p NRestarts --value)"
            sleep 10
            WORKER_RESTARTS_AFTER="$(systemctl show drvowa-ai-worker.service -p NRestarts --value)"
            if ! systemctl is-active --quiet drvowa-ai-worker.service \
              || [ "$WORKER_RESTARTS_AFTER" != "$WORKER_RESTARTS_BEFORE" ]; then
              echo "DRVOWA AI worker failed to stay up after restart"
              journalctl -u drvowa-ai-worker.service -n 60 --no-pager || true
              exit 1
            fi
            echo "AI worker is running"

            echo "==> Waiting for app"
            HEALTHY=0
            for attempt in {1..15}; do
              if curl --fail --silent --show-error http://127.0.0.1:3100/api/health >/dev/null; then
                HEALTHY=1
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" = 1 ]; then
              echo "DRVOWA production health check passed"
              echo "==> Installing hourly billing maintenance timer"
              printf '%s\n' '[Unit]' 'Description=DRVO billing subscription and renewal maintenance' \
                'After=network-online.target' 'Wants=network-online.target' '' '[Service]' \
                'Type=oneshot' 'WorkingDirectory=/home/drvowa/app' 'Environment=NODE_ENV=production' \
                'ExecStart=/usr/bin/env npm run billing:maintain' 'TimeoutStartSec=600' \
                > /etc/systemd/system/drvowa-billing-maintenance.service
              printf '%s\n' '[Unit]' 'Description=Run DRVO billing maintenance hourly' '' \
                '[Timer]' 'OnCalendar=hourly' 'Persistent=true' \
                'Unit=drvowa-billing-maintenance.service' '' '[Install]' \
                'WantedBy=timers.target' \
                > /etc/systemd/system/drvowa-billing-maintenance.timer
              systemctl daemon-reload
              systemctl enable --now drvowa-billing-maintenance.timer
              systemctl is-active --quiet drvowa-billing-maintenance.timer
              echo "Billing maintenance timer active"
              echo "==> Billing maintenance service execution status"
              systemctl show drvowa-billing-maintenance.service \
                --property=ActiveState,Result,ExecMainStatus,ExecMainStartTimestamp,ExecMainExitTimestamp \
                --no-pager
              echo "==> Billing maintenance timer schedule"
              systemctl list-timers drvowa-billing-maintenance.timer --no-pager
              exit 0
            fi

            echo "DRVOWA production health check failed"
            systemctl status drvowa.service --no-pager -l || true
            journalctl -u drvowa.service -n 80 --no-pager || true
            exit 1
          REMOTE
