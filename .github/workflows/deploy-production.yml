name: Deploy DRVOWA Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: drvowa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  billing-checks:
    uses: ./.github/workflows/billing-sql-ci.yml
  whatsapp-source-checks:
    name: WhatsApp origin isolation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/unit/whatsapp-source-guard.test.ts
      - run: npm run typecheck
  deploy:
    needs: [billing-checks, whatsapp-source-checks]
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DRVOWA_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.DRVOWA_VPS_HOST }}
          VPS_USER: ${{ secrets.DRVOWA_VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "DEPLOY_SHA=$DEPLOY_SHA DEPLOY_BEFORE=$DEPLOY_BEFORE bash -se" <<'REMOTE'
            set -euo pipefail

            cd /home/drvowa/app

            # The owner authorized a one-time UI-only release without a fresh SQL backup.
            # This exception cannot be used for schema, API, configuration or worker changes.
            # Full releases MUST pass the fresh full-backup gate below.
            VISUAL_ONLY=0
            BRAND_ASSETS_ONLY=0
            CURRENT_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            DEPLOY_TITLE="$(git show -s --format=%s "$DEPLOY_SHA")"
            case "$DEPLOY_TITLE" in
              "release(visual-only):"*)
                test -n "$DEPLOY_BEFORE" && test "$CURRENT_SHA" = "$DEPLOY_BEFORE" || {
                  echo "BLOCKED: UI-only release must deploy directly from the verified current main SHA"
                  exit 1
                }
                test "$(git rev-list --count "$DEPLOY_BEFORE..$DEPLOY_SHA")" = 1 || {
                  echo "BLOCKED: UI-only release must be a single reviewed commit"
                  exit 1
                }
                CHANGED_FILES="$(git diff --name-only "$DEPLOY_BEFORE" "$DEPLOY_SHA")"
                test -n "$CHANGED_FILES" || { echo "BLOCKED: no changed UI files"; exit 1; }
                while IFS= read -r file; do
                  case "$file" in
                    src/app/api/*|src/app/admin/brand-assets/*|src/modules/*)
                      echo "BLOCKED: UI-only release contains a route/API/module change: $file"; exit 1 ;;
                    src/app/*|src/components/*|.github/workflows/deploy-production.yml|tests/unit/brand-v2-ui-only-release.test.ts|tests/unit/theme-contrast.test.ts)
                      ;;
                    *) echo "BLOCKED: non-visual file in UI-only release: $file"; exit 1 ;;
                  esac
                done <<< "$CHANGED_FILES"
                test -r .env.production.local || { echo "BLOCKED: production environment not available"; exit 1; }
                VISUAL_ONLY=1
                echo "PASS: UI-only scope verified; no migrations, no environment changes, no worker restart"
                ;;
              "release(brand-assets-no-db):"*)
                test -n "$DEPLOY_BEFORE" && test "$CURRENT_SHA" = "$DEPLOY_BEFORE" || {
                  echo "BLOCKED: brand assets release must start from exact running main SHA"; exit 1;
                }
                test "$(git rev-list --count "$DEPLOY_BEFORE..$DEPLOY_SHA")" = 1 || {
                  echo "BLOCKED: brand assets release must be exactly one reviewed commit"; exit 1;
                }
                CHANGED_FILES="$(git diff --name-only "$DEPLOY_BEFORE" "$DEPLOY_SHA")"
                test -n "$CHANGED_FILES" || { echo "BLOCKED: empty brand assets release"; exit 1; }
                while IFS= read -r file; do
                  case "$file" in
                    .github/workflows/deploy-production.yml|docs/brand-v2/ADMIN-BRAND-ASSETS.md|tests/unit/brand-admin-assets.test.ts|tests/unit/brand-v2-ui-only-release.test.ts|src/app/layout.tsx|src/app/admin/layout.tsx|src/app/admin/brand-assets/page.tsx|src/app/api/admin/brand-assets/route.ts|src/app/api/admin/brand-assets/\[id\]/route.ts|src/app/api/admin/brand-assets/\[id\]/image/route.ts|src/app/api/brand/assets/\[variant\]/route.ts|src/components/admin/admin-brand-assets.tsx|src/components/admin/admin-navigation.tsx|src/components/brand/brand-logo.tsx|src/modules/brand/assets.ts)
                      ;;
                    *) echo "BLOCKED: unauthorized file in no-DB Brand Assets release: $file"; exit 1 ;;
                  esac
                done <<< "$CHANGED_FILES"
                git show "$DEPLOY_SHA:src/modules/brand/assets.ts" | grep -Fq 'from "node:fs/promises"' || {
                  echo "BLOCKED: expected isolated filesystem-backed brand module missing"; exit 1;
                }
                if git show "$DEPLOY_SHA:src/modules/brand/assets.ts" | grep -Eq '@/lib/db|TblBrandAsset'; then
                  echo "BLOCKED: brand module must not access SQL"; exit 1;
                fi
                BRAND_ASSETS_ONLY=1
                echo "PASS: isolated Brand Assets filesystem release, no schema migration"
                ;;
            esac

            if [ "$VISUAL_ONLY" != 1 ] && [ "$BRAND_ASSETS_ONLY" != 1 ]; then
            # Fail closed before git checkout, env flag edits, migrations, or restarts.
            # This is evidence of a recent backup record, NOT a restore proof.
            echo "==> Checking recent production SQL full-backup metadata (read-only)"
            test -r .env.production.local || { echo "BLOCKED: production DB configuration unavailable"; exit 1; }
            node --env-file=.env.production.local --input-type=module <<'BACKUP_GATE'
          import sql from "mssql";
          const required = ["DB_SERVER", "DB_PORT", "DB_NAME", "DB_USER", "DB_PASSWORD"];
          if (required.some((key) => !process.env[key])) {
            console.error("BLOCKED: DB configuration incomplete");
            process.exit(1);
          }
          const parseBool = (value, fallback) =>
            value == null ? fallback : ["true", "1", "yes"].includes(value.toLowerCase());
          let pool;
          try {
            pool = await new sql.ConnectionPool({
              server: process.env.DB_SERVER,
              port: Number(process.env.DB_PORT),
              database: process.env.DB_NAME,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              options: {
                encrypt: parseBool(process.env.DB_ENCRYPT, true),
                trustServerCertificate: parseBool(process.env.DB_TRUST_SERVER_CERTIFICATE, false),
              },
              connectionTimeout: 15000,
              requestTimeout: 20000,
            }).connect();
            const records = await pool.request().query(`
              SELECT TOP (1)
                backup_finish_date AS finished,
                backup_size AS bytes,
                is_damaged AS damaged
              FROM msdb.dbo.backupset
              WHERE database_name = DB_NAME() AND type = N'D'
              ORDER BY backup_finish_date DESC
            `);
            const last = records.recordset[0];
            const ageHours = last ? (Date.now() - new Date(last.finished).getTime()) / 3600000 : Infinity;
            const recent = Number.isFinite(ageHours) && ageHours >= 0 && ageHours <= 24;
            if (!last || !recent || !(Number(last.bytes) > 0) || Boolean(last.damaged)) {
              throw new Error("backup freshness or metadata validation failed");
            }
            console.log("PASS: production SQL full-backup record is <=24 hours old and not damaged");
            console.log("NOTE: restore/VERIFYONLY proof is still an independent release prerequisite");
          } catch {
            console.error("BLOCKED: recent SQL full-backup evidence unavailable; no deployment mutations performed");
            process.exitCode = 1;
          } finally {
            if (pool) await pool.close();
          }
          BACKUP_GATE
            fi
            # A failed UI-only build or health check must restore the last running app SHA.
            # This rollback affects app code only: no DB, env, or WhatsApp auth changes.
            UI_CHECKED_OUT=0
            rollback_visual_release() {
              rc="$?"
              trap - EXIT
              if [ "$rc" -ne 0 ] && [ "$UI_CHECKED_OUT" = 1 ] && { [ "$VISUAL_ONLY" = 1 ] || [ "$BRAND_ASSETS_ONLY" = 1 ]; }; then
                echo "==> Visual-only release failed: restoring previous deployed app SHA"
                set +e
                git checkout --detach "$CURRENT_SHA"
                npm ci && npm run build && systemctl restart drvowa.service
                rollback_rc="$?"
                if [ "$rollback_rc" -eq 0 ] && systemctl is-active --quiet drvowa.service; then
                  echo "==> Rollback app service active; check /api/health"
                  curl --fail --silent --show-error --max-time 15 'http://127.0.0.1:3100/api/health?ready=1' >/dev/null || true
                else
                  echo "ERROR: app rollback failed; restore manually from recorded SHA"
                fi
              fi
              exit "$rc"
            }
            trap rollback_visual_release EXIT
            echo "==> Checking out the exact commit verified by billing SQL CI"
            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            if [ "$VISUAL_ONLY" = 1 ] || [ "$BRAND_ASSETS_ONLY" = 1 ]; then UI_CHECKED_OUT=1; fi
            echo "Deploying verified commit $DEPLOY_SHA"

            if [ "$VISUAL_ONLY" != 1 ] && [ "$BRAND_ASSETS_ONLY" != 1 ]; then
            echo "==> Ensuring integration encryption secret"
            ENV_FILE=".env.production.local"
            touch "$ENV_FILE"
            if ! grep -q '^INTEGRATION_SECRET_KEY=' "$ENV_FILE"; then
              SECRET_VALUE="$(openssl rand -hex 32)"
              printf '\nINTEGRATION_SECRET_KEY=%s\n' "$SECRET_VALUE" >> "$ENV_FILE"
            fi
            # Activate Pricing V1 for the owner's production test businesses.
            # All flags remain explicit and reversible via the environment file.
            for key in DRVO_PRICING_V1_PAYMENTS DRVO_PRICING_V1_FREE_TRIAL DRVO_PRICING_V1_ADDON_DRAFTS DRVO_PRICING_V1_ADDON_CONSUMPTION; do
              if grep -q "^$key=" "$ENV_FILE"; then
                sed -i "s/^$key=.*/$key=true/" "$ENV_FILE"
              else
                printf '%s=true\n' "$key" >> "$ENV_FILE"
              fi
            done
            # Owner-confirmed, opt-in-only label campaigns. No run is created
            # unless an OWNER reviews copy and eligible recipient count.
            if grep -q '^DRVO_LABEL_CAMPAIGNS_SEND_ENABLED=' "$ENV_FILE"; then
              sed -i 's/^DRVO_LABEL_CAMPAIGNS_SEND_ENABLED=.*/DRVO_LABEL_CAMPAIGNS_SEND_ENABLED=true/' "$ENV_FILE"
            else
              printf '%s\n' 'DRVO_LABEL_CAMPAIGNS_SEND_ENABLED=true' >> "$ENV_FILE"
            fi
            chmod 600 "$ENV_FILE"
            else
              echo "==> isolated no-DB release: preserving all existing production secrets and feature flags"
            fi

            if [ "$BRAND_ASSETS_ONLY" = 1 ]; then
              echo "==> Provisioning private durable Brand Asset storage outside app checkout"
              BRAND_SERVICE_USER="$(systemctl show drvowa.service -p User --value)"
              BRAND_SERVICE_USER="${BRAND_SERVICE_USER:-root}"
              id "$BRAND_SERVICE_USER" >/dev/null
              BRAND_SERVICE_GROUP="$(id -gn "$BRAND_SERVICE_USER")"
              for folder in /var/lib/drvowa/brand-assets /var/lib/drvowa/brand-assets/assets /var/lib/drvowa/brand-assets/images /var/lib/drvowa/brand-assets/published /var/lib/drvowa/brand-assets/locks; do
                install -d -m 0700 -o "$BRAND_SERVICE_USER" -g "$BRAND_SERVICE_GROUP" "$folder"
              done
              test "$(stat -c %a /var/lib/drvowa/brand-assets)" = 700 || { echo "BLOCKED: brand directory insecure"; exit 1; }
              test "$(stat -c %U /var/lib/drvowa/brand-assets)" = "$BRAND_SERVICE_USER" || { echo "BLOCKED: incorrect Brand Assets owner"; exit 1; }
              echo "PASS: private Brand Assets storage is owned by app systemd service account"
            fi
            echo "==> Installing locked dependencies"
            npm ci

            echo "==> Typecheck"
            npm run typecheck

            echo "==> Production build"
            npm run build

            echo "==> AI worker boot check"
            npm run ai:worker:check

            if [ "$VISUAL_ONLY" != 1 ] && [ "$BRAND_ASSETS_ONLY" != 1 ]; then
              echo "==> Applying database migrations"
              npm run db:migrate
            else
              echo "==> UI-only release: SQL migrations explicitly skipped"
            fi

            echo "==> Verifying WhatsApp campaign schema and queue (read-only)"
            node --env-file-if-exists=.env.production.local --import tsx scripts/campaign-production-smoke.ts

            echo "==> Verifying Pricing V1 production plans, real invoices, receipts and balances (read-only)"
            node --env-file-if-exists=.env.production.local --import tsx scripts/pricing-v1-production-smoke.ts

            echo "==> Validating admin financial reports against the production database (read-only)"
            npx tsx scripts/admin-financial-smoke.ts

            echo "==> Verifying billing refunds, net collections and replay (read-only)"
            test -r /etc/drvowa/financial-hub.env || { echo "Financial service environment is unavailable to billing smoke"; exit 1; }
            node --env-file-if-exists=.env.production.local --env-file=/etc/drvowa/financial-hub.env --import tsx scripts/billing-production-smoke.ts

            echo "==> Restarting app service"
            systemctl restart drvowa.service

            if [ "$VISUAL_ONLY" != 1 ] && [ "$BRAND_ASSETS_ONLY" != 1 ]; then
            echo "==> Restarting AI worker for integration-aware replies"
            systemctl restart drvowa-ai-worker.service
            sleep 2
            WORKER_RESTARTS_BEFORE="$(systemctl show drvowa-ai-worker.service -p NRestarts --value)"
            sleep 10
            WORKER_RESTARTS_AFTER="$(systemctl show drvowa-ai-worker.service -p NRestarts --value)"
            if ! systemctl is-active --quiet drvowa-ai-worker.service \
              || [ "$WORKER_RESTARTS_AFTER" != "$WORKER_RESTARTS_BEFORE" ]; then
              echo "DRVOWA AI worker failed to stay up after restart"
              journalctl -u drvowa-ai-worker.service -n 60 --no-pager || true
              exit 1
            fi
            echo "AI worker is running"
            else
              systemctl is-active --quiet drvowa-ai-worker.service || { echo "BLOCKED: AI worker not healthy"; exit 1; }
              echo "==> UI-only release: AI worker stays running without restart"
            fi

            echo "==> Waiting for app"
            HEALTHY=0
            for attempt in {1..15}; do
              if curl --fail --silent --show-error http://127.0.0.1:3100/api/health >/dev/null; then
                HEALTHY=1
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" = 1 ]; then
              echo "DRVOWA production health check passed"
              if [ "$VISUAL_ONLY" = 1 ]; then
                echo "PASS: UI-only release completed, no SQL or billing scheduler modifications"
                exit 0
              fi
              if [ "$BRAND_ASSETS_ONLY" = 1 ]; then
                echo "==> Checking no-SQL Brand Assets routes and unauthenticated access protection"
                PUBLIC_CODE="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 http://127.0.0.1:3100/api/brand/assets/primary-dark)"
                case "$PUBLIC_CODE" in 200|307) ;; *) echo "BLOCKED: public Brand Assets fallback endpoint failed: $PUBLIC_CODE"; exit 1 ;; esac
                ADMIN_CODE="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 http://127.0.0.1:3100/api/admin/brand-assets)"
                case "$ADMIN_CODE" in 401|403) ;; *) echo "BLOCKED: protected brand upload API incorrectly exposed: $ADMIN_CODE"; exit 1 ;; esac
                echo "PASS: Brand Assets production routes, auth boundary, health and no-schema deployment"
                exit 0
              fi
              echo "==> Installing hourly billing maintenance timer"
              printf '%s\n' '[Unit]' 'Description=DRVO billing subscription and renewal maintenance' \
                'After=network-online.target' 'Wants=network-online.target' '' '[Service]' \
                'Type=oneshot' 'WorkingDirectory=/home/drvowa/app' 'Environment=NODE_ENV=production' \
                'ExecStart=/usr/bin/env npm run billing:maintain' 'TimeoutStartSec=600' \
                > /etc/systemd/system/drvowa-billing-maintenance.service
              printf '%s\n' '[Unit]' 'Description=Run DRVO billing maintenance hourly' '' \
                '[Timer]' 'OnCalendar=hourly' 'Persistent=true' \
                'Unit=drvowa-billing-maintenance.service' '' '[Install]' \
                'WantedBy=timers.target' \
                > /etc/systemd/system/drvowa-billing-maintenance.timer
              systemctl daemon-reload
              systemctl enable --now drvowa-billing-maintenance.timer
              systemctl is-active --quiet drvowa-billing-maintenance.timer
              echo "Billing maintenance timer active"
              echo "==> Billing maintenance service execution status"
              systemctl show drvowa-billing-maintenance.service \
                --property=ActiveState,Result,ExecMainStatus,ExecMainStartTimestamp,ExecMainExitTimestamp \
                --no-pager
              echo "==> Billing maintenance timer schedule"
              systemctl list-timers drvowa-billing-maintenance.timer --no-pager
              exit 0
            fi

            echo "DRVOWA production health check failed"
            systemctl status drvowa.service --no-pager -l || true
            journalctl -u drvowa.service -n 80 --no-pager || true
            exit 1
          REMOTE
